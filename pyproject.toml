[project]
name = "apcupsd-client"
version = "0.2.0"
description = "FastAPI + Redis dashboard for monitoring multiple APC UPS devices via apcupsd NIS"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # handled by formatter
  "B008",   # FastAPI dependency defaults pattern
  "B904",   # raise without from in except (noise in handlers)
  "SIM105", # try/except/pass vs contextlib.suppress (not always clearer)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "F401", "F811"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 65
