<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setup — UPS Dashboard</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="auth-body">
  <div class="auth-card wide" data-auth-card="setup">
    <div class="auth-mark">APC</div>
    <h1>First-run Setup</h1>
    <p class="muted">Create the admin account before exposing UPS controls.</p>
    <form id="setup-form">
      <div class="form-field">
        <label for="username">Admin username</label>
        <input type="text" id="username" name="username" required minlength="3" autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="form-field">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" required minlength="8" />
      </div>
      <button type="submit" class="btn-primary btn-block">Create admin account</button>
      <div id="setup-error" class="login-error" hidden></div>
    </form>
    <p class="muted auth-note">After setup you will be redirected to the dashboard. Configure UPS devices and SMTP from the nav.</p>
  </div>
  <script src="/static/js/auth.js?v=1"></script>
</body>
</html>
