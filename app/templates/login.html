<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — UPS Dashboard</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="auth-body">
  <div class="auth-card" data-auth-card="login">
    <div class="auth-mark">APC</div>
    <h1>UPS Dashboard</h1>
    <p class="muted">Sign in to monitor runtime, load, transfers, and alerts.</p>
    <form id="login-form">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Sign in</button>
      <div id="login-error" class="login-error" hidden></div>
    </form>
  </div>
  <script src="/static/js/auth.js?v=1"></script>
</body>
</html>
